<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线评测系统</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #24292f;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e1e4e8;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: 700;
  }
  main {
    max-width: 720px;
    margin: 60px auto;
    padding: 0 20px;
    text-align: center;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 12px;
  }
  p {
    color: #57606a;
    font-size: 15px;
    line-height: 1.7;
    margin: 0 0 28px;
  }
  .btn {
    display: inline-block;
    padding: 11px 26px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border-radius: 6px;
    text-decoration: none;
  }
  .btn:hover { background: #1d4ed8; }
</style>
</head>
<body>

<header>在线评测系统</header>

<main>
  <h1>首页</h1>
  <p>查看所有题目，请点击下方按钮。</p>
  <a class="btn" href="/all_questions">全部题目</a>
</main>

</body>
</html>
